flight_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
      password: "{{ env_var('DBT_SNOWFLAKE_PASSWORD') }}"
      role: SWEDAVIA_DBT_ROLE
      database: FLIGHT_DB
      warehouse: SWEDAVIA_WH
      schema: ANALYTICS
      threads: 1